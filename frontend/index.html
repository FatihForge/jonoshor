<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JonoShor — Human Rights & Citizen Voice Platform</title>
    <meta name="description" content="JonoShor is an independent, non-partisan human rights and citizen protection platform in Bangladesh dedicated to documenting, verifying, and publishing evidence of injustice in the public interest." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased flex flex-col">
    <!-- Accessible Skip to Content Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="app" class="flex flex-col min-h-screen">
      <!-- Navigation Mount Point -->
      <header id="site-header" class="border-b border-slate-200 bg-white/95 backdrop-blur sticky top-0 z-50" role="banner"></header>
      
      <!-- Main Content View Mount Point -->
      <main id="main-content" class="flex-grow container mx-auto px-4 py-8" role="main" tabindex="-1">
        <div class="text-center py-16">
          <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-4">JonoShor (জনস্বর)</h1>
          <p class="text-xl text-slate-600 max-w-2xl mx-auto">
            An independent platform dedicated to safeguarding truth, justice, and citizen human rights in Bangladesh.
          </p>
          <div class="mt-8 flex justify-center gap-4">
            <a href="#/complaint/new" id="hero-submit-complaint" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg shadow-sm transition focus-visible:ring-2 focus-visible:ring-red-600 focus-visible:ring-offset-2">
              Submit Complaint
            </a>
            <a href="#/reports" id="hero-view-reports" class="px-6 py-3 bg-white hover:bg-slate-50 text-slate-700 font-medium rounded-lg border border-slate-300 shadow-xs transition focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2">
              View Public Reports
            </a>
          </div>
        </div>
      </main>

      <!-- Footer Mount Point -->
      <footer id="site-footer" class="border-t border-slate-200 bg-white text-slate-500 py-8 text-center text-sm" role="contentinfo">
        <p>© 2026 JonoShor. All rights reserved.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
