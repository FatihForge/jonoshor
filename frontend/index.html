<!DOCTYPE html>
<html lang="bn" class="dark">
  <head>

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app" class="flex flex-col min-h-screen">
      <!-- Navigation Mount Point -->
      <header id="site-header" class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50"></header>
      
      <!-- Main Content View Mount Point -->
      <main id="main-content" class="flex-grow container mx-auto px-4 py-8">
        <div class="text-center py-16">
          <h1 class="text-4xl font-extrabold tracking-tight text-white mb-4">জনস্বর (JonoShor)</h1>
          <p class="text-xl text-slate-400 max-w-2xl mx-auto">

          </p>
          <div class="mt-8 flex justify-center gap-4">
            <a href="#/complaint/new" id="hero-submit-complaint" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg shadow-lg transition">

            </a>
            <a href="#/reports" id="hero-view-reports" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-700 transition">
              পাবলিক রিপোর্ট দেখুন
            </a>
          </div>
        </div>
      </main>

      <!-- Footer Mount Point -->
      <footer id="site-footer" class="border-t border-slate-800 bg-slate-900 text-slate-400 py-8 text-center text-sm">
        <p>© 2026 জনস্বর (JonoShor)। সর্বস্বত্ব সংরক্ষিত।</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
